task: gen_binary_classification_with_metrics
dataset_path: giannor/dala_label_da
dataset_name: null
output_type: generate_until
training_split: train
validation_split: val
test_split: test
num_fewshot: 0

# Input prompt matching original dataset column names
doc_to_text: |
  Overvej denne danske sætning og tjek om den er grammatisk korrekt eller forkert.

  Regler:
  - Hvis sætningen er korrekt, skal du skrive "korrekt"
  - Hvis sætningen er forkert, skal du skrive "forkert"
  - Udskriv kun én af "korrekt" og "forkert"
  - Udskriv ikke noget andet
  - Udgiv ingen begrundelse eller forklaring

  Sætning: {{text}}
  Svar: 

doc_to_target: "{{label_da}}"

# Two choices for binary classification
# doc_to_choice: ["forkert", "korrekt"]

generation_kwargs:
  max_gen_toks: 100
  temperature: 0.7
  do_sample: true

# Use bypass metric to skip evaluation
metric_list:
  - metric: bleu
    aggregation: bleu
    higher_is_better: true
  - metric: exact_match
    aggregation: mean
    higher_is_better: true

metadata:
  version: 1.0
  description: "DaLA binary generative"