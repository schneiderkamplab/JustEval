# Model configuration
model: vllm
model_args: "pretrained=meta-llama/Meta-Llama-3-8B-Instruct,dtype=float16,tensor_parallel_size=1"

# Task configuration
tasks: gec_open_generation
include_path: ./

# Execution settings
batch_size: 16
device: cuda:0
limit: 100  # null = no limit, or set a number

# Output and logging
output_path: ./dala_outputs/
log_samples: true
predict_only: true

# Generation settings (can override task defaults)
gen_kwargs:
  until: ["\n"]  # Stop generation at newline
  # max_gen_toks: 50
  # temperature: 0.1

# Other settings
num_fewshot: 0